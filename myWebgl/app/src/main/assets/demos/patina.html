<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Patina</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
// Real-time weathering of a copper sculpture, all procedural in one shader: no textures.
// Masks drive the layers — cavity occlusion (where water and grime collect), up-facing
// exposure, vertical rain streaks and noise — and a single age value walks the surface from
// polished copper, through brown cuprite tarnish (highlights go "from mirror to milk"), to a
// crusty blue-green verdigris. Lighting is GGX PBR with a procedural studio environment.

const s = D.surface({ scale: 0.6, minScale: 0.35, maxScale: 0.9 });
const gl = D.webgl2(s);
D.badge('WebGL2 · procedural PBR weathering');

const FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uEye, uRight, uUp, uFwd;
uniform float uAge;
uniform int uObject;
uniform int uLight;
${D.GLSL_NOISE}

const float FLOOR_Y = -1.2;
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float sdTorus(vec3 p, vec2 t) { return length(vec2(length(p.xz) - t.x, p.y)) - t.y; }
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }

// Fluted column: grooves and mouldings give the weathering lots of places to collect.
float column(vec3 p) {
  float a = atan(p.z, p.x);
  float flute = 0.03 * smoothstep(-0.82, -0.72, p.y) * smoothstep(0.7, 0.6, p.y) * pow(0.5 + 0.5 * cos(a * 16.0), 2.0);
  float shaft = (max(length(p.xz) - 0.42 + flute, abs(p.y) - 0.9)) * 0.8;
  float base = min(sdTorus(p - vec3(0.0, -0.86, 0.0), vec2(0.44, 0.07)), sdBox(p - vec3(0.0, -0.99, 0.0), vec3(0.58, 0.07, 0.58)) - 0.01);
  float cap = min(sdTorus(p - vec3(0.0, 0.8, 0.0), vec2(0.44, 0.06)), sdBox(p - vec3(0.0, 0.97, 0.0), vec3(0.62, 0.08, 0.62)) - 0.01);
  vec3 q = p - vec3(0.0, 0.86, 0.0);
  q.x = abs(q.x) - 0.5;
  cap = smin(cap, sdTorus(q.yxz, vec2(0.12, 0.045)), 0.04); // volutes
  return min(smin(shaft, base, 0.05), smin(shaft, cap, 0.05));
}

// Three interlocked beaded rings.
float ring(vec3 p, float R, float r) {
  float a = atan(p.z, p.x);
  return length(vec2(length(p.xz) - R, p.y)) - r - 0.007 * sin(a * 36.0);
}
float knot(vec3 p) {
  p.y += 0.17;   // rest the lowest ring on the pedestal
  float d = ring(p, 0.72, 0.15);
  vec3 q = p; q.yz *= rot(1.5708); q.x -= 0.35;
  d = min(d, ring(q, 0.72, 0.15));
  q = p; q.xy *= rot(1.5708); q.z -= 0.35;
  d = min(d, ring(q, 0.72, 0.15));
  return d * 0.85;
}

// Ornamental sphere with raised bands, carved meridians and knobs.
float orb(vec3 p) {
  p.y += 0.19;   // rest on the pedestal
  float a = atan(p.z, p.x);
  float d = length(p) - 0.85;
  d += 0.025 * pow(abs(sin(a * 6.0)), 8.0) * (1.0 - abs(p.y));
  d -= 0.035 * smoothstep(0.82, 1.0, cos(p.y * 10.0));
  vec3 k = p; k.xz = abs(k.xz);
  d = smin(d, length(k - vec3(0.62, 0.0, 0.62)) - 0.09, 0.06);
  return d * 0.8;
}

// id: 0 floor, 1 sculpture, 2 pedestal
float map(vec3 p, out float id) {
  float floorD = p.y - FLOOR_Y;
  float ped = sdBox(p - vec3(0.0, FLOOR_Y + 0.08, 0.0), vec3(0.75, 0.08, 0.75)) - 0.01;
  float obj = uObject == 0 ? column(p - vec3(0.0, -0.02, 0.0)) : uObject == 1 ? knot(p) : orb(p);
  id = 1.0;
  float d = obj;
  if (ped < d) { d = ped; id = 2.0; }
  if (floorD < d) { d = floorD; id = 0.0; }
  return d;
}
float map(vec3 p) { float id; return map(p, id); }

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0012, -0.0012);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

float occlusion(vec3 p, vec3 n, float scale) {
  float occ = 0.0, w = 1.0;
  for (int i = 1; i <= 5; i++) {
    float h = scale * float(i) / 5.0;
    occ += (h - map(p + n * h)) * w;
    w *= 0.75;
  }
  return clamp(1.0 - occ * 2.5 / scale, 0.0, 1.0);
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd * t);
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.25);
    if (res < 0.002 || t > 6.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float fbm3(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise3(p); p = p * 2.07 + 1.3; a *= 0.5; } return s; }

// Procedural studio / outdoor environment; roughness widens and dims the light shapes.
vec3 env(vec3 r, float rough) {
  float w = 0.02 + rough * 0.55;
  float k = 1.0 / (1.0 + rough * 5.0);
  vec3 c;
  if (uLight == 1) {        // sunset
    c = mix(vec3(0.05, 0.03, 0.03), vec3(0.5, 0.28, 0.18), smoothstep(-0.3, 0.4, r.y));
    c += vec3(6.0, 3.2, 1.4) * k * smoothstep(1.0 - w * 2.0 - 0.06, 1.0 - w, dot(r, normalize(vec3(-0.8, 0.25, 0.5))));
    c += vec3(0.4, 0.5, 0.9) * smoothstep(0.0, 0.9, r.y) * 0.6;
  } else if (uLight == 2) { // overcast
    c = mix(vec3(0.12, 0.13, 0.13), vec3(0.85, 0.88, 0.92), smoothstep(-0.3, 0.8, r.y));
  } else {                  // studio softboxes
    c = mix(vec3(0.05), vec3(0.32, 0.32, 0.34), smoothstep(-0.3, 0.7, r.y));
    c += vec3(5.0) * k * smoothstep(1.0 - w * 3.0 - 0.1, 1.0 - w, dot(r, normalize(vec3(0.2, 1.0, 0.3))));
    c += vec3(2.4, 1.9, 1.5) * k * smoothstep(1.0 - w * 2.0 - 0.04, 1.0 - w * 0.5, dot(r, normalize(vec3(-1.0, 0.3, 0.6))));
    c += vec3(0.9, 1.2, 1.8) * k * smoothstep(1.0 - w * 2.0 - 0.03, 1.0 - w * 0.5, dot(r, normalize(vec3(1.0, 0.15, -0.5))));
  }
  return c;
}
vec3 keyDir() { return uLight == 1 ? normalize(vec3(-0.8, 0.35, 0.5)) : normalize(vec3(0.35, 0.85, 0.4)); }
vec3 keyCol() { return uLight == 1 ? vec3(3.2, 1.8, 0.9) : uLight == 2 ? vec3(0.6) : vec3(2.2); }

float ggx(float NoH, float a) { float a2 = a * a; float d = NoH * NoH * (a2 - 1.0) + 1.0; return a2 / (3.14159 * d * d); }

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  vec3 rd = normalize(uFwd * 1.7 + uRight * uv.x + uUp * uv.y);
  vec3 ro = uEye;

  float t = 0.0, id = -1.0;
  bool hit = false;
  for (int i = 0; i < 110; i++) {
    float d = map(ro + rd * t, id);
    if (abs(d) < 0.0006 * t) { hit = true; break; }
    t += d;
    if (t > 25.0) break;
  }

  vec3 col;
  if (!hit) {
    col = env(rd, 0.6) * 0.35;
  } else {
    vec3 p = ro + rd * t;
    vec3 n = normalAt(p);
    vec3 V = -rd;
    float ao = occlusion(p, n, 0.18);
    vec3 albedo;
    float metal, rough;

    if (id > 1.5) {
      albedo = vec3(0.08); metal = 0.0; rough = 0.6;          // dark stone pedestal
    } else if (id > 0.5) {
      float age = uAge;
      float cavity = 1.0 - occlusion(p, n, 0.35);         // broad crevices
      float up = clamp(n.y, 0.0, 1.0);
      float n1 = fbm3(p * 3.5);
      float n2 = noise3(p * 18.0);
      // Rain streaks: noise stretched vertically, strongest on steep faces.
      float streak = noise2(vec2((p.x + p.z) * 16.0 + floor(p.y * 0.0), p.y * 1.4)) * (1.0 - up);
      streak = smoothstep(0.55, 0.9, streak);

      // Layer 1: tarnish (cuprite) darkens and dulls the copper; none at age 0.
      float tarnish = smoothstep(0.02, 0.4, age * 1.3 * (0.75 + 0.5 * n1) + cavity * 0.25 * age);
      vec3 copper = vec3(0.955, 0.638, 0.538);
      vec3 brown = mix(vec3(0.42, 0.2, 0.12), vec3(0.16, 0.09, 0.06), smoothstep(0.3, 0.8, age + (n2 - 0.5) * 0.2));
      albedo = mix(copper, brown, tarnish);
      metal = 1.0;
      rough = mix(0.1 + 0.05 * n2, 0.45 + 0.15 * n1, tarnish);

      // Layer 2: verdigris grows from cavities, up-facing ledges and drip lines.
      // Each point gets an onset age: the most exposed spots turn green around age 0.15,
      // sheltered smooth faces only near the end.
      float exposure = clamp(cavity * 0.9 + up * 0.7 + streak * 0.35 + (n1 - 0.5) * 0.6, 0.0, 1.0);
      float verd = smoothstep(0.0, 0.1, age - 0.3 - (1.0 - exposure) * 0.7);
      vec3 green = mix(vec3(0.2, 0.46, 0.38), vec3(0.46, 0.74, 0.64), n2 * 0.7 + up * 0.3);
      albedo = mix(albedo, green, verd);
      metal = mix(metal, 0.0, verd);
      rough = mix(rough, 0.85, verd);
      // Crusty relief on the oxide.
      if (verd > 0.01) {
        vec3 g = vec3(noise3(p * 22.0 + vec3(0.1, 0.0, 0.0)), noise3(p * 22.0 + vec3(0.0, 0.1, 0.0)), noise3(p * 22.0 + vec3(0.0, 0.0, 0.1))) - noise3(p * 22.0);
        n = normalize(n + g * 3.5 * verd);
      }
      // Grime collects in the deepest recesses over time.
      albedo *= mix(1.0, 0.45, cavity * smoothstep(0.2, 1.0, age));
    } else {
      albedo = vec3(0.07, 0.068, 0.066) * (0.85 + 0.15 * noise2(p.xz * 4.0)); metal = 0.0; rough = 0.9;
    }

    vec3 L = keyDir();
    vec3 H = normalize(L + V);
    float NoL = max(dot(n, L), 0.0), NoV = max(dot(n, V), 1e-3), NoH = max(dot(n, H), 0.0);
    vec3 F0 = mix(vec3(0.04), albedo, metal);
    vec3 F = F0 + (1.0 - F0) * pow(1.0 - NoV, 5.0);
    float a = max(rough * rough, 0.002);
    float k = a * 0.5;
    float G = (NoL / (NoL * (1.0 - k) + k)) * (NoV / (NoV * (1.0 - k) + k));
    vec3 spec = F * ggx(NoH, a) * G / (4.0 * NoV + 1e-3);
    float sh = NoL > 0.0 ? softShadow(p + n * 0.01, L) : 0.0;
    vec3 diffuse = albedo * (1.0 - metal) / 3.14159;
    col = (diffuse + spec) * keyCol() * NoL * sh;
    // Image-based light: irradiance from the blurred environment, reflections by roughness.
    vec3 R = reflect(rd, n);
    col += albedo * (1.0 - metal) * env(n, 1.0) * 0.6 * ao;
    col += F * env(R, rough) * mix(ao, 1.0, 0.4);
    // Let the floor dissolve into the backdrop instead of ending at a hard horizon.
    col = mix(col, env(rd, 0.6) * 0.35, smoothstep(5.0, 14.0, t));
  }

  // ACES-ish tone map, gamma, vignette.
  col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);
  col = pow(col, vec3(1.0 / 2.2));
  vec2 q = vUv - 0.5;
  col *= 1.0 - dot(q, q) * 0.9;
  col += (hash12(gl_FragCoord.xy + fract(uTime) * 97.0) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;

const prog = D.program(gl, D.FS_VS, FS);
const cam = D.orbit(s.canvas, {
  dist: s.aspect < 1 ? 5.2 : 4.0, pitch: 0.22, target: [0, -0.15, 0],
  minDist: 2.4, maxDist: 9, minPitch: -0.05, maxPitch: 1.2, autoRotate: 0.15,
});

// `timeline` drives the automatic time-lapse and overshoots 0..1 so each end holds briefly.
let age = 0, timeline = 0, auto = true, object = 0, light = 0;
const years = (a) => (a < 0.01 ? '새것' : `${Math.round(a * a * 150)}년`);
D.cycle(['기둥', '고리 매듭', '장식 구'], (i) => (object = i), 'object');
D.cycle(['스튜디오', '노을', '흐린 야외'], (i) => (light = i), 'light');
const autoBtn = D.cycle(['자동 풍화', '정지'], (i) => {
  auto = i === 0;
  if (auto) timeline = age;
}, 'auto');
const ageSlider = D.slider('세월', 0, 1, 0, (v) => (age = v), 'age', years);
// Touching the slider takes over from the automatic time-lapse.
ageSlider.querySelector('input').addEventListener('input', () => {
  if (auto) autoBtn.click();
});
if (D.qs.has('age') && auto) autoBtn.click();
D.hint('드래그: 회전 · 핀치: 확대 · 세월 슬라이더로 풍화 정도를 조절하세요');

let dirSign = 1;
D.loop(s, (time, dt) => {
  cam.update(dt);
  if (auto) {
    // Time-lapse: weather over ~24 s, hold, then reverse back to new copper.
    timeline += dirSign * dt / 24;
    if (timeline >= 1.15) dirSign = -1;
    if (timeline <= -0.15) dirSign = 1;
    ageSlider.set(D.clamp(timeline, 0, 1));
  }
  const b = cam.basis();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, s.width, s.height);
  prog.use().set({
    uRes: [s.width, s.height], uTime: time,
    uEye: b.eye, uRight: b.right, uUp: b.up, uFwd: b.forward,
    uAge: D.clamp(age, 0, 1), uObject: object, uLight: light,
  });
  D.drawFullscreen(gl);
  D.stat(`경과 ${years(D.clamp(age, 0, 1))}`);
});
</script>
</body>
