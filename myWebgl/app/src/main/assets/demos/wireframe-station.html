<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wireframe Station</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
// A procedurally generated five-level station drawn as layered wireframe: corridor networks,
// shops, columns, escalators, platforms with moving trains, and passengers walking the graph.
// Every vertex stores its floor index, so the exploded view is just a spacing uniform.

const s = D.surface({ scale: 1, minScale: 0.6, maxScale: 1 });
const gl = D.webgl2(s);
D.badge('WebGL2 · line rendering · bloom');
const bloom = new D.Bloom(gl, { levels: 5 });
s.onResize = (w, h) => bloom.resize(w, h);
s.onResize(s.width, s.height);

const rand = D.rng(1923);
const FLOORS = 5, NX = 7, NZ = 5, DX = 2.4, DZ = 2.2;
const FLOOR_NAMES = ['B3 승강장', 'B2', 'B1', '1F 개찰', '2F'];
const nx = (i) => (i - (NX - 1) / 2) * DX;
const nz = (j) => (j - (NZ - 1) / 2) * DZ;
const id = (f, i, j) => f * NX * NZ + j * NX + i;

// ---- static line geometry: [x, y, z, floor, alpha, tint] -----------------------
const lines = [];
const line = (a, fa, b, fb, alpha, tint = 0) => lines.push(...a, fa, alpha, tint, ...b, fb, alpha, tint);
const rect = (x0, z0, x1, z1, y, f, alpha, tint = 0) => {
  line([x0, y, z0], f, [x1, y, z0], f, alpha, tint);
  line([x1, y, z0], f, [x1, y, z1], f, alpha, tint);
  line([x1, y, z1], f, [x0, y, z1], f, alpha, tint);
  line([x0, y, z1], f, [x0, y, z0], f, alpha, tint);
};
const box = (cx, cz, w, d, h, f, alpha, tint = 0) => {
  const x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2;
  rect(x0, z0, x1, z1, 0, f, alpha, tint);
  rect(x0, z0, x1, z1, h, f, alpha, tint);
  for (const [x, z] of [[x0, z0], [x1, z0], [x1, z1], [x0, z1]]) line([x, 0, z], f, [x, h, z], f, alpha, tint);
};

// Graph for passengers: adjacency by node id.
const adj = new Map();
const link = (a, b) => {
  if (!adj.has(a)) adj.set(a, []);
  if (!adj.has(b)) adj.set(b, []);
  adj.get(a).push(b);
  adj.get(b).push(a);
};
const nodePos = (n) => {
  const f = Math.floor(n / (NX * NZ)), r = n % (NX * NZ);
  return [nx(r % NX), nz(Math.floor(r / NX)), f];
};

function corridor(f, a, b) {
  const [ax, az] = nodePos(a), [bx, bz] = nodePos(b);
  const alongX = Math.abs(bx - ax) > 0.01;
  const w = 0.42;
  const ox = alongX ? 0 : w, oz = alongX ? w : 0;
  for (const side of [-1, 1]) {
    line([ax + ox * side, 0, az + oz * side], f, [bx + ox * side, 0, bz + oz * side], f, 0.55);
    line([ax + ox * side, 0.45, az + oz * side], f, [bx + ox * side, 0.45, bz + oz * side], f, 0.18);
  }
  // Shops on either side.
  for (const side of [-1, 1]) {
    if (rand() < 0.45) {
      const len = (alongX ? Math.abs(bx - ax) : Math.abs(bz - az)) * (0.4 + rand() * 0.3);
      const depth = 0.5 + rand() * 0.4, h = 0.35 + rand() * 0.5;
      const cx = (ax + bx) / 2 + (alongX ? 0 : side * (w + 0.1 + depth / 2));
      const cz = (az + bz) / 2 + (alongX ? side * (w + 0.1 + depth / 2) : 0);
      box(cx, cz, alongX ? len : depth, alongX ? depth : len, h, f, 0.28);
    }
  }
  link(a, b);
}

for (let f = 0; f < FLOORS; f++) {
  // Slab outline and faint floor grid.
  rect(-9.2, -6.4, 9.2, 6.4, 0, f, 0.45);
  for (let x = -9.2; x <= 9.21; x += 1.15) line([x, 0, -6.4], f, [x, 0, 6.4], f, 0.05);
  for (let z = -6.4; z <= 6.41; z += 1.6) line([-9.2, 0, z], f, [9.2, 0, z], f, 0.05);

  if (f === 0) {
    // Platform level: two island platforms (rows 1, 3), cross bridges, three tracks (rows 0, 2, 4).
    for (const j of [1, 3]) {
      for (let i = 0; i < NX - 1; i++) corridor(f, id(f, i, j), id(f, i + 1, j));
      rect(nx(0) - 1, nz(j) - 0.55, nx(NX - 1) + 1, nz(j) + 0.55, 0.02, f, 0.6);
    }
    for (const i of [1, 3, 5]) {
      corridor(f, id(f, i, 1), id(f, i, 2));
      corridor(f, id(f, i, 2), id(f, i, 3));
    }
    for (const j of [0, 2, 4]) {
      for (const dz of [-0.32, 0.32]) line([-11, -0.05, nz(j) + dz], f, [11, -0.05, nz(j) + dz], f, 0.5, 2);
      for (let x = -11; x <= 11; x += 0.5) line([x, -0.05, nz(j) - 0.42], f, [x, -0.05, nz(j) + 0.42], f, 0.12, 2);
    }
    continue;
  }

  // Concourse levels: random spanning tree over the grid plus a few loops.
  const seen = new Set();
  const stack = [[Math.floor(rand() * NX), Math.floor(rand() * NZ)]];
  seen.add(stack[0].join());
  while (stack.length) {
    const [i, j] = stack[stack.length - 1];
    const next = [[i + 1, j], [i - 1, j], [i, j + 1], [i, j - 1]]
      .filter(([a, b]) => a >= 0 && b >= 0 && a < NX && b < NZ && !seen.has(`${a},${b}`));
    if (!next.length) { stack.pop(); continue; }
    const [a, b] = next[Math.floor(rand() * next.length)];
    seen.add(`${a},${b}`);
    corridor(f, id(f, i, j), id(f, a, b));
    stack.push([a, b]);
  }
  for (let k = 0; k < 6; k++) {
    const i = Math.floor(rand() * (NX - 1)), j = Math.floor(rand() * NZ);
    if (!adj.get(id(f, i, j)).includes(id(f, i + 1, j))) corridor(f, id(f, i, j), id(f, i + 1, j));
  }
}

// Columns span from each floor to the next (so they stretch in the exploded view).
for (let f = 0; f < FLOORS - 1; f++) {
  for (let i = 0; i < NX; i += 2) for (let j = 0; j < NZ; j += 2) {
    line([nx(i) + 1.2, 0, nz(j) + 1.1], f, [nx(i) + 1.2, 0, nz(j) + 1.1], f + 1, 0.1);
  }
}

// Escalators between consecutive floors, also walkable by passengers.
for (let f = 0; f < FLOORS - 1; f++) {
  const used = new Set();
  for (let k = 0; k < 3; k++) {
    const j = f === 0 ? [1, 3][k % 2] : Math.floor(rand() * NZ);
    const i = Math.floor(rand() * (NX - 1));
    if (used.has(`${i},${j}`)) continue;
    used.add(`${i},${j}`);
    const a = id(f, i, j), b = id(f + 1, i + 1, j);
    if (!adj.has(a) || !adj.has(b)) continue;
    for (const dz of [-0.3, 0.3]) line([nx(i), 0.05, nz(j) + dz], f, [nx(i + 1), 0.05, nz(j) + dz], f + 1, 0.8, 1);
    for (let k2 = 1; k2 < 10; k2++) {
      const t = k2 / 10;
      const x = nx(i) + (nx(i + 1) - nx(i)) * t;
      line([x, 0.05, nz(j) - 0.3], f + t, [x, 0.05, nz(j) + 0.3], f + t, 0.35, 1);
    }
    link(a, b);
  }
}

function vao(data, usage = gl.STATIC_DRAW) {
  const v = gl.createVertexArray();
  gl.bindVertexArray(v);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage);
  const layout = [3, 1, 1, 1];
  let off = 0;
  layout.forEach((size, loc) => {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 24, off);
    off += size * 4;
  });
  gl.bindVertexArray(null);
  return { v, buf };
}
const staticLines = vao(new Float32Array(lines));
const staticCount = lines.length / 6;

// ---- dynamic geometry: trains + passengers ------------------------------------
const CARS = 6, TRAINS = 3;
const trainData = new Float32Array(TRAINS * CARS * 24 * 6);
const trainLines = vao(trainData, gl.DYNAMIC_DRAW);
const trains = [0, 2, 4].map((j, k) => ({ z: nz(j), speed: (k % 2 ? -1 : 1) * (2.2 + k * 0.6), offset: k * 9 }));

function buildTrains(time) {
  let o = 0;
  const put = (x, y, z) => { trainData.set([x, y, z, 0, 0.9, 3], o); o += 6; };
  for (const tr of trains) {
    const head = (((time * tr.speed + tr.offset) % 34) + 34) % 34 - 17;
    for (let c = 0; c < CARS; c++) {
      const cx = head - Math.sign(tr.speed) * c * 1.75;
      const visible = Math.abs(cx) < 10.2;
      const x0 = cx - 0.8, x1 = cx + 0.8, z0 = tr.z - 0.3, z1 = tr.z + 0.3, y0 = 0, y1 = visible ? 0.55 : 0;
      const edges = [
        [x0, y0, z0, x1, y0, z0], [x1, y0, z0, x1, y0, z1], [x1, y0, z1, x0, y0, z1], [x0, y0, z1, x0, y0, z0],
        [x0, y1, z0, x1, y1, z0], [x1, y1, z0, x1, y1, z1], [x1, y1, z1, x0, y1, z1], [x0, y1, z1, x0, y1, z0],
        [x0, y0, z0, x0, y1, z0], [x1, y0, z0, x1, y1, z0], [x1, y0, z1, x1, y1, z1], [x0, y0, z1, x0, y1, z1],
      ];
      for (const e of edges) {
        if (!visible) { put(0, -99, 0); put(0, -99, 0); continue; }
        put(e[0], e[1], e[2]);
        put(e[3], e[4], e[5]);
      }
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, trainLines.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, trainData);
}

const walkable = [...adj.keys()];
const AGENTS = 900;
const agentData = new Float32Array(AGENTS * 6);
const agentPoints = vao(agentData, gl.DYNAMIC_DRAW);
const agents = Array.from({ length: AGENTS }, () => {
  const a = walkable[Math.floor(rand() * walkable.length)];
  const nbrs = adj.get(a);
  return { a, b: nbrs[Math.floor(rand() * nbrs.length)], prev: -1, t: rand(), speed: 0.9 + rand() * 0.9, lane: (rand() - 0.5) * 0.5, hot: rand() < 0.08 };
});

function stepAgents(dt) {
  agents.forEach((g, k) => {
    const [ax, az, af] = nodePos(g.a), [bx, bz, bf] = nodePos(g.b);
    const len = Math.hypot(bx - ax, bz - az, (bf - af) * 2) || 1;
    g.t += (g.speed * dt) / len;
    if (g.t >= 1) {
      const options = adj.get(g.b).filter((n) => n !== g.a);
      const next = options.length ? options[Math.floor(rand() * options.length)] : g.a;
      g.a = g.b;
      g.b = next;
      g.t = 0;
    }
    const t = Math.min(g.t, 1);
    const [px, pz, pf] = nodePos(g.a), [qx, qz, qf] = nodePos(g.b);
    const alongX = Math.abs(qx - px) > 0.01;
    agentData.set([
      px + (qx - px) * t + (alongX ? 0 : g.lane),
      0.12,
      pz + (qz - pz) * t + (alongX ? g.lane : 0),
      pf + (qf - pf) * t,
      g.hot ? 2.2 : 1.2,
      g.hot ? 1 : 4,
    ], k * 6);
  });
  gl.bindBuffer(gl.ARRAY_BUFFER, agentPoints.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, agentData);
}

// ---- shaders ------------------------------------------------------------------
const VS = `#version 300 es
layout(location = 0) in vec3 aPos;
layout(location = 1) in float aFloor;
layout(location = 2) in float aAlpha;
layout(location = 3) in float aTint;
uniform mat4 uVP;
uniform vec3 uEye;
uniform float uSpacing;
uniform float uScanY;
uniform float uScan;
uniform float uFocus;
uniform float uPointSize;
out vec3 vCol;
vec3 floorColor(float f) {
  float t = f / ${FLOORS - 1}.0;
  return t < 0.5 ? mix(vec3(0.49, 1.0, 0.42), vec3(0.0, 0.76, 1.0), t * 2.0)
                 : mix(vec3(0.0, 0.76, 1.0), vec3(0.7, 0.45, 1.0), t * 2.0 - 1.0);
}
void main() {
  vec3 p = aPos;
  p.y += (aFloor - ${(FLOORS - 1) / 2}.0) * uSpacing;
  gl_Position = uVP * vec4(p, 1.0);
  gl_PointSize = uPointSize / gl_Position.w;
  vec3 c = aTint < 0.5 ? floorColor(aFloor)
         : aTint < 1.5 ? vec3(1.0, 0.55, 0.2)
         : aTint < 2.5 ? vec3(1.0, 0.8, 0.45)
         : aTint < 3.5 ? vec3(0.9, 0.95, 1.0)
         : mix(floorColor(aFloor), vec3(1.0), 0.6);
  float fog = exp(-length(p - uEye) * 0.03);
  float focus = uFocus < 0.0 ? 1.0 : mix(0.12, 1.4, 1.0 - clamp(abs(aFloor - uFocus), 0.0, 1.0));
  float scan = uScan * exp(-abs(p.y - uScanY) * 4.0) * 2.0;
  vCol = c * aAlpha * (fog * focus + scan);
}`;
const LINE_FS = `#version 300 es
precision highp float;
in vec3 vCol;
out vec4 o;
void main() { o = vec4(vCol, 1.0); }`;
const POINT_FS = `#version 300 es
precision highp float;
in vec3 vCol;
out vec4 o;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float d = dot(q, q);
  if (d > 1.0) discard;
  o = vec4(vCol * exp(-d * 3.0), 1.0);
}`;
const lineProg = D.program(gl, VS, LINE_FS);
const pointProg = D.program(gl, VS, POINT_FS);

// ---- interaction ------------------------------------------------------------
const cam = D.orbit(s.canvas, {
  dist: s.aspect < 1 ? 30 : 20, pitch: 0.55, yaw: 0.6,
  minDist: 8, maxDist: 50, minPitch: 0.05, autoRotate: 0.08,
});
let spacing = 2.4, spacingTarget = 2.4;
let focus = -1;
let scanOn = 1;
const explodeBtn = D.cycle(['펼치기', '접기'], (i) => (spacingTarget = i ? 4.2 : 2.4), 'explode');
D.cycle(['전체 층', ...FLOOR_NAMES], (i) => (focus = i - 1), 'floor');
D.cycle(['스캔 켜짐', '스캔 꺼짐'], (i) => (scanOn = i ? 0 : 1), 'scan');
cam.onDoubleTap = () => explodeBtn.click();
D.hint('드래그: 회전 · 핀치: 확대 · 두 번 탭: 층 펼치기');
D.stat(`${FLOORS} levels · ${staticCount / 2} edges · ${AGENTS} passengers`);

let focusAnim = -1;
D.loop(s, (time, dt) => {
  cam.update(dt);
  spacing += (spacingTarget - spacing) * Math.min(1, dt * 3);
  focusAnim = focus < 0 ? -1 : focusAnim < 0 ? focus : focusAnim + (focus - focusAnim) * Math.min(1, dt * 5);
  stepAgents(dt);
  buildTrains(time);

  const span = (FLOORS - 1) * spacing + 2;
  const scanY = -span / 2 + ((time * 0.35) % 1) * span;
  const uniforms = {
    uVP: cam.viewProj(s.aspect), uEye: cam.eye(), uSpacing: spacing,
    uScanY: scanY, uScan: scanOn, uFocus: focusAnim, uPointSize: s.height * 0.12,
  };

  bloom.begin();
  gl.clearColor(0.004, 0.008, 0.02, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

  lineProg.use().set(uniforms);
  gl.bindVertexArray(staticLines.v);
  gl.drawArrays(gl.LINES, 0, staticCount);
  gl.bindVertexArray(trainLines.v);
  gl.drawArrays(gl.LINES, 0, trainData.length / 6);

  pointProg.use().set(uniforms);
  gl.bindVertexArray(agentPoints.v);
  gl.drawArrays(gl.POINTS, 0, AGENTS);

  bloom.end({ strength: 0.9, exposure: 1.4, vignette: 0.45, time });
});
</script>
</body>
</html>
