<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Compute Boids</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
// 3D flocking (separation / alignment / cohesion). With WebGPU the flock is stepped by a WGSL
// compute shader that tiles neighbours through workgroup memory; otherwise the same rules run
// as a WebGL2 fragment-shader GPGPU pass. Either way each boid is drawn as an instanced dart
// oriented along its velocity.

const RULES = {
  radius: 6.5, view: 0.75, sep: 0.3,
  wAlign: 1.6, wCohesion: 0.9, wSep: 0.55, wBound: 1.8,
  minSpeed: 1.2, maxSpeed: 3.0, size: 0.17,
};
const BG = [0.012, 0.035, 0.04];

const s = D.surface({ scale: 1, minScale: 0.6, maxScale: 1 });
const cam = D.orbit(s.canvas, { dist: s.aspect < 1 ? 17 : 13, pitch: 0.25, minDist: 4, maxDist: 30, autoRotate: 0.1 });
let scatter = 0;
cam.onTap = () => (scatter = 14);
D.button('흩어지게', () => (scatter = 14));
let paused = false;
D.cycle(['일시정지', '재생'], (i) => (paused = i === 1));
D.hint('드래그: 회전 · 핀치: 확대 · 탭: 무리 흩어뜨리기');

function seedBoids(n) {
  const data = new Float32Array(n * 8);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.cbrt(Math.random()) * RULES.radius * 0.8, z = Math.random() * 2 - 1;
    const q = Math.sqrt(1 - z * z);
    data.set([Math.cos(a) * q * r, z * r * 0.6, Math.sin(a) * q * r, 1], i * 8);
    const v = D.vec3.norm([Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5]);
    data.set([v[0] * 2, v[1] * 2, v[2] * 2, 0], i * 8 + 4);
  }
  return data;
}

// Dart: a four-sided pyramid pointing along +z (local x = right, y = up).
const SHAPE = [
  [0, 0, 1], [-0.38, 0, -0.5], [0, 0.22, -0.38],
  [0, 0, 1], [0, 0.22, -0.38], [0.38, 0, -0.5],
  [0, 0, 1], [0.38, 0, -0.5], [0, -0.12, -0.38],
  [0, 0, 1], [0, -0.12, -0.38], [-0.38, 0, -0.5],
];
const glslVec3 = (v) => `vec3(${v.map((x) => x.toFixed(2)).join(', ')})`;
const wgslVec3 = (v) => `vec3f(${v.map((x) => x.toFixed(2)).join(', ')})`;

// ============================================================ WebGPU path
async function startWebGPU() {
  if (!navigator.gpu || D.param("backend", "webgpu") === "webgl") return false;
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) return false;
  const device = await adapter.requestDevice();
  const ctx = s.canvas.getContext('webgpu');
  if (!ctx) return false;
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  device.lost.then((info) => {
    if (info.reason !== 'destroyed') D.fail(`WebGPU 디바이스 손실: ${info.message}`);
  });

  const N = D.clamp(Math.round(D.param("count", 4096) / 64) * 64, 64, 65536);
  D.badge(`WebGPU compute · ${N.toLocaleString()} boids`);

  const SIM = /* wgsl */ `
struct Params { count: u32, dt: f32, time: f32, pad: f32, scatter: vec4f };
struct Boid { pos: vec4f, vel: vec4f };
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read> src: array<Boid>;
@group(0) @binding(2) var<storage, read_write> dst: array<Boid>;
var<workgroup> tp: array<vec3f, 64>;
var<workgroup> tv: array<vec3f, 64>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3u, @builtin(local_invocation_index) li: u32) {
  let i = gid.x;
  let me = src[i];
  let p = me.pos.xyz;
  var v = me.vel.xyz;
  var sep = vec3f(0.0);
  var ali = vec3f(0.0);
  var coh = vec3f(0.0);
  var n = 0.0;
  for (var base = 0u; base < P.count; base += 64u) {
    let o = src[base + li];
    tp[li] = o.pos.xyz;
    tv[li] = o.vel.xyz;
    workgroupBarrier();
    for (var k = 0u; k < 64u; k++) {
      let d = tp[k] - p;
      let d2 = dot(d, d);
      if (d2 < ${RULES.view * RULES.view} && d2 > 1e-6) {
        n += 1.0;
        ali += tv[k];
        coh += tp[k];
        if (d2 < ${RULES.sep * RULES.sep}) { sep -= d / d2; }
      }
    }
    workgroupBarrier();
  }
  var acc = vec3f(0.0);
  if (n > 0.0) {
    acc += (ali / n - v) * ${RULES.wAlign};
    acc += (coh / n - p) * ${RULES.wCohesion};
    acc += sep * ${RULES.wSep};
  }
  let L = length(p);
  if (L > ${RULES.radius}) { acc -= p / L * (L - ${RULES.radius}) * ${RULES.wBound}; }
  acc.y -= p.y * 0.06;
  let sd = p - P.scatter.xyz + vec3f(1e-4);
  acc += normalize(sd) * P.scatter.w * exp(-dot(sd, sd) * 0.04);
  v += acc * P.dt;
  let sp = length(v);
  v = v / max(sp, 1e-4) * clamp(sp, ${RULES.minSpeed}, ${RULES.maxSpeed});
  dst[i] = Boid(vec4f(p + v * P.dt, 1.0), vec4f(v, 0.0));
}`;

  const DRAW = /* wgsl */ `
struct Cam { vp: mat4x4f, eye: vec4f, misc: vec4f };
@group(0) @binding(0) var<uniform> C: Cam;
struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) wp: vec3f,
  @location(1) col: vec3f,
};
@vertex
fn vs(@builtin(vertex_index) vi: u32, @location(0) bpos: vec4f, @location(1) bvel: vec4f) -> VOut {
  var shape = array<vec3f, 12>(${SHAPE.map(wgslVec3).join(', ')});
  let f = normalize(bvel.xyz + vec3f(0.0, 0.0, 1e-5));
  var r = cross(vec3f(0.0, 1.0, 0.0), f);
  if (length(r) < 1e-3) { r = vec3f(1.0, 0.0, 0.0); }
  r = normalize(r);
  let u = cross(f, r);
  let l = shape[vi] * C.misc.x;
  let wp = bpos.xyz + r * l.x + u * l.y + f * l.z;
  var o: VOut;
  o.pos = C.vp * vec4f(wp, 1.0);
  o.wp = wp;
  let h = atan2(f.z, f.x) / 6.2831853 + 0.5;
  let a = vec3f(0.62, 1.0, 0.0);
  let b = vec3f(0.0, 0.83, 0.5);
  let c = vec3f(0.2, 0.75, 1.0);
  let base = select(mix(b, c, h * 2.0 - 1.0), mix(a, b, h * 2.0), h < 0.5);
  let speed = length(bvel.xyz) / ${RULES.maxSpeed};
  o.col = base * (0.85 + 0.7 * speed);
  return o;
}
@fragment
fn fs(in: VOut) -> @location(0) vec4f {
  let n = normalize(cross(dpdx(in.wp), dpdy(in.wp)));
  let dif = abs(dot(n, normalize(vec3f(0.4, 1.0, 0.3)))) * 0.75 + 0.25;
  let fog = exp(-length(in.wp - C.eye.xyz) * 0.03);
  return vec4f(mix(vec3f(${BG.join(', ')}), in.col * dif, fog), 1.0);
}`;

  const boidBufs = [0, 1].map(() => device.createBuffer({
    size: N * 32,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
  }));
  device.queue.writeBuffer(boidBufs[0], 0, seedBoids(N));
  const params = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const camBuf = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  device.pushErrorScope('validation');
  const simModule = device.createShaderModule({ code: SIM });
  const drawModule = device.createShaderModule({ code: DRAW });
  const simPipe = device.createComputePipeline({ layout: 'auto', compute: { module: simModule, entryPoint: 'main' } });
  const drawPipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: {
      module: drawModule,
      entryPoint: 'vs',
      buffers: [{
        arrayStride: 32,
        stepMode: 'instance',
        attributes: [
          { shaderLocation: 0, offset: 0, format: 'float32x4' },
          { shaderLocation: 1, offset: 16, format: 'float32x4' },
        ],
      }],
    },
    fragment: { module: drawModule, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });
  const err = await device.popErrorScope();
  if (err) D.fail(`WebGPU 셰이더 오류\n${err.message}`);

  const simGroups = [0, 1].map((k) => device.createBindGroup({
    layout: simPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: params } },
      { binding: 1, resource: { buffer: boidBufs[k] } },
      { binding: 2, resource: { buffer: boidBufs[1 - k] } },
    ],
  }));
  const drawGroup = device.createBindGroup({
    layout: drawPipe.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: camBuf } }],
  });

  let depth = null;
  s.onResize = (w, h) => {
    if (depth) depth.destroy();
    depth = device.createTexture({ size: [w, h], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
  };
  s.onResize(s.width, s.height);

  const pBuf = new ArrayBuffer(32);
  const pU = new Uint32Array(pBuf), pF = new Float32Array(pBuf);
  let cur = 0;
  D.loop(s, (time, dt) => {
    cam.update(dt);
    const enc = device.createCommandEncoder();
    if (!paused) {
      pU[0] = N;
      pF[1] = Math.min(dt, 1 / 30);
      pF[2] = time;
      pF.set([0, 0, 0, scatter], 4);
      device.queue.writeBuffer(params, 0, pBuf);
      const pass = enc.beginComputePass();
      pass.setPipeline(simPipe);
      pass.setBindGroup(0, simGroups[cur]);
      pass.dispatchWorkgroups(N / 64);
      pass.end();
      cur = 1 - cur;
      scatter *= Math.exp(-dt * 4);
    }

    const camData = new Float32Array(24);
    camData.set(cam.viewProj(s.aspect), 0);
    camData.set([...cam.eye(), 1], 16);
    camData.set([RULES.size, 0, 0, 0], 20);
    device.queue.writeBuffer(camBuf, 0, camData);

    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        clearValue: { r: BG[0], g: BG[1], b: BG[2], a: 1 },
        loadOp: 'clear',
        storeOp: 'store',
      }],
      depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'discard' },
    });
    pass.setPipeline(drawPipe);
    pass.setBindGroup(0, drawGroup);
    pass.setVertexBuffer(0, boidBufs[cur]);
    pass.draw(12, N);
    pass.end();
    device.queue.submit([enc.finish()]);
  });
  return true;
}

// ============================================================ WebGL2 fallback
function startWebGL2() {
  const gl = D.webgl2(s, { depth: true });
  D.requireFloatRT(gl);
  const W = 64, N = D.clamp(Math.round(D.param("count", 2048) / W) * W, 64, 8192), H = N / W;
  D.badge(`WebGPU 미지원 → WebGL2 GPGPU · ${N.toLocaleString()} boids`);

  const SIM_FS = `#version 300 es
precision highp float;
precision highp int;
uniform highp sampler2D uPos;
uniform highp sampler2D uVel;
uniform float uDt;
uniform vec4 uScatter;
layout(location = 0) out vec4 oPos;
layout(location = 1) out vec4 oVel;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec3 p = texelFetch(uPos, c, 0).xyz;
  vec3 v = texelFetch(uVel, c, 0).xyz;
  vec3 sep = vec3(0.0), ali = vec3(0.0), coh = vec3(0.0);
  float n = 0.0;
  for (int y = 0; y < ${H}; y++) {
    for (int x = 0; x < ${W}; x++) {
      vec3 q = texelFetch(uPos, ivec2(x, y), 0).xyz;
      vec3 d = q - p;
      float d2 = dot(d, d);
      if (d2 < ${(RULES.view * RULES.view).toFixed(4)} && d2 > 1e-6) {
        n += 1.0;
        ali += texelFetch(uVel, ivec2(x, y), 0).xyz;
        coh += q;
        if (d2 < ${(RULES.sep * RULES.sep).toFixed(4)}) sep -= d / d2;
      }
    }
  }
  vec3 acc = vec3(0.0);
  if (n > 0.0) {
    acc += (ali / n - v) * ${RULES.wAlign.toFixed(2)};
    acc += (coh / n - p) * ${RULES.wCohesion.toFixed(2)};
    acc += sep * ${RULES.wSep.toFixed(2)};
  }
  float L = length(p);
  if (L > ${RULES.radius.toFixed(2)}) acc -= p / L * (L - ${RULES.radius.toFixed(2)}) * ${RULES.wBound.toFixed(2)};
  acc.y -= p.y * 0.06;
  vec3 sd = p - uScatter.xyz + 1e-4;
  acc += normalize(sd) * uScatter.w * exp(-dot(sd, sd) * 0.04);
  v += acc * uDt;
  float sp = length(v);
  v = v / max(sp, 1e-4) * clamp(sp, ${RULES.minSpeed.toFixed(2)}, ${RULES.maxSpeed.toFixed(2)});
  oPos = vec4(p + v * uDt, 1.0);
  oVel = vec4(v, 0.0);
}`;

  const DRAW_VS = `#version 300 es
precision highp float;
precision highp int;
uniform highp sampler2D uPos;
uniform highp sampler2D uVel;
uniform mat4 uVP;
uniform float uSize;
const vec3 SHAPE[12] = vec3[12](${SHAPE.map(glslVec3).join(', ')});
out vec3 vWp;
out vec3 vCol;
void main() {
  ivec2 c = ivec2(gl_InstanceID % ${W}, gl_InstanceID / ${W});
  vec3 p = texelFetch(uPos, c, 0).xyz;
  vec3 vel = texelFetch(uVel, c, 0).xyz;
  vec3 f = normalize(vel + vec3(0.0, 0.0, 1e-5));
  vec3 r = cross(vec3(0.0, 1.0, 0.0), f);
  r = length(r) < 1e-3 ? vec3(1.0, 0.0, 0.0) : normalize(r);
  vec3 u = cross(f, r);
  vec3 l = SHAPE[gl_VertexID] * uSize;
  vWp = p + r * l.x + u * l.y + f * l.z;
  gl_Position = uVP * vec4(vWp, 1.0);
  float h = atan(f.z, f.x) / 6.2831853 + 0.5;
  vec3 a = vec3(0.62, 1.0, 0.0), b = vec3(0.0, 0.83, 0.5), cc = vec3(0.2, 0.75, 1.0);
  vec3 base = h < 0.5 ? mix(a, b, h * 2.0) : mix(b, cc, h * 2.0 - 1.0);
  vCol = base * (0.85 + 0.7 * length(vel) / ${RULES.maxSpeed.toFixed(2)});
}`;
  const DRAW_FS = `#version 300 es
precision highp float;
in vec3 vWp;
in vec3 vCol;
uniform vec3 uEye;
out vec4 o;
void main() {
  vec3 n = normalize(cross(dFdx(vWp), dFdy(vWp)));
  float dif = abs(dot(n, normalize(vec3(0.4, 1.0, 0.3)))) * 0.75 + 0.25;
  float fog = exp(-length(vWp - uEye) * 0.03);
  o = vec4(mix(vec3(${BG.join(', ')}), vCol * dif, fog), 1.0);
}`;

  const sim = D.program(gl, D.FS_VS, SIM_FS);
  const draw = D.program(gl, DRAW_VS, DRAW_FS);
  const seed = seedBoids(N);
  const pos = new Float32Array(N * 4), vel = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    pos.set(seed.subarray(i * 8, i * 8 + 4), i * 4);
    vel.set(seed.subarray(i * 8 + 4, i * 8 + 8), i * 4);
  }
  const tex = (data) => D.texture(gl, W, H, { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT, filter: gl.NEAREST, data });
  const state = [0, 1].map(() => {
    const p = tex(pos), v = tex(vel);
    return { pos: p, vel: v, fbo: D.framebuffer(gl, [p, v]) };
  });
  let cur = 0;

  D.loop(s, (time, dt) => {
    cam.update(dt);
    if (!paused) {
      const src = state[cur], dst = state[1 - cur];
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
      gl.viewport(0, 0, W, H);
      gl.disable(gl.DEPTH_TEST);
      D.bindTextures(gl, [src.pos, src.vel]);
      sim.use().set({ uPos: 0, uVel: 1, uDt: Math.min(dt, 1 / 30), uScatter: [0, 0, 0, scatter] });
      D.drawFullscreen(gl);
      cur = 1 - cur;
      scatter *= Math.exp(-dt * 4);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, s.width, s.height);
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    D.bindTextures(gl, [state[cur].pos, state[cur].vel]);
    draw.use().set({ uPos: 0, uVel: 1, uVP: cam.viewProj(s.aspect), uSize: RULES.size, uEye: cam.eye() });
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 12, N);
  });
}

startWebGPU()
  .catch((e) => {
    console.warn('WebGPU init failed, using WebGL2', e);
    return false;
  })
  .then((ok) => {
    if (!ok && !D.failed) startWebGL2();
  });
</script>
</body>
</html>
