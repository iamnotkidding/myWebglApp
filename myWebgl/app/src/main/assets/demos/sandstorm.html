<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Giza Sandstorm</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
// Ray-marched desert: SDF pyramids on a dune heightfield, low sun with soft shadows, and a
// sandstorm made of wind-advected volumetric dust plus screen-space sand streaks.

const s = D.surface({ scale: 0.6, minScale: 0.3, maxScale: 0.85 });
const gl = D.webgl2(s);
D.badge('WebGL2 · ray-marched SDF');

const FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uEye, uRight, uUp, uFwd;
uniform float uStorm;      // 0 calm … 1 full storm
uniform float uGust;       // short burst from a tap
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec3 uSkyTop, uSkyHorizon;
${D.GLSL_NOISE}

const vec3 WIND = vec3(1.0, 0.05, 0.35);

float fbm2(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 3; i++) { s += a * noise2(p); p = p * 2.03 + 7.1; a *= 0.5; }
  return s;
}

// Dunes: long wind-aligned ridges warped by noise, flattened on the plateau under the pyramids.
float terrain(vec2 p) {
  float warp = fbm2(p * 0.08) * 6.0;
  float ridge = 1.0 - abs(sin(p.x * 0.22 + p.y * 0.08 + warp));
  float h = ridge * ridge * 0.9 + fbm2(p * 0.15) * 1.4 - 0.6;
  float plateau = smoothstep(9.0, 20.0, length(p - vec2(0.0, -2.0)));
  return mix(-0.02, h, plateau);
}

float sdPyramid(vec3 p, float h) {
  float m2 = h * h + 0.25;
  p.xz = abs(p.xz);
  p.xz = (p.z > p.x) ? p.zx : p.xz;
  p.xz -= 0.5;
  vec3 q = vec3(p.z, h * p.y - 0.5 * p.x, h * p.x + 0.5 * p.y);
  float s = max(-q.x, 0.0);
  float t = clamp((q.y - 0.5 * p.z) / (m2 + 0.25), 0.0, 1.0);
  float a = m2 * (q.x + s) * (q.x + s) + q.y * q.y;
  float b = m2 * (q.x + 0.5 * t) * (q.x + 0.5 * t) + (q.y - m2 * t) * (q.y - m2 * t);
  float d2 = min(q.y, -q.x * m2 - q.y * 0.5) > 0.0 ? 0.0 : min(a, b);
  return sqrt((d2 + q.z * q.z) / m2) * sign(max(q.z, -p.y));
}

float pyramids(vec3 p) {
  float d = sdPyramid((p - vec3(0.0, 0.0, 0.0)) / 4.6, 0.64) * 4.6;              // Khufu
  d = min(d, sdPyramid((p - vec3(-6.2, 0.0, -5.6)) / 4.3, 0.66) * 4.3);         // Khafre
  d = min(d, sdPyramid((p - vec3(-10.0, 0.0, -11.5)) / 2.1, 0.62) * 2.1);       // Menkaure
  for (int i = 0; i < 3; i++) {                                                  // queens' pyramids
    d = min(d, sdPyramid((p - vec3(4.2, 0.0, -1.5 + float(i) * 1.6)) / 0.9, 0.62) * 0.9);
  }
  return d;
}

// Returns distance; id = 1 for stone, 0 for sand.
float map(vec3 p, out float id) {
  float dt = (p.y - terrain(p.xz)) * 0.6;
  float dp = pyramids(p);
  id = dp < dt ? 1.0 : 0.0;
  return min(dt, dp);
}
float map(vec3 p) { float id; return map(p, id); }

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.01, 0.0);
  return normalize(vec3(map(p + e.xyy) - map(p - e.xyy),
                        map(p + e.yxy) - map(p - e.yxy),
                        map(p + e.yyx) - map(p - e.yyx)));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.08;
  for (int i = 0; i < 24; i++) {
    float h = map(ro + rd * t);
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.08, 1.2);
    if (res < 0.01 || t > 30.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 sky(vec3 rd) {
  float sun = max(dot(rd, uSunDir), 0.0);
  vec3 c = mix(uSkyHorizon, uSkyTop, pow(max(rd.y, 0.0), 0.5));
  c += uSunCol * (pow(sun, 600.0) * 6.0 + pow(sun, 12.0) * 0.35);
  return c;
}

// Dust density in the storm layer, advected along the wind.
float dust(vec3 p) {
  vec3 q = p * 0.18 - WIND * uTime * (0.25 + uStorm * 0.6);
  float n = noise3(q) * 0.6 + noise3(q * 2.3 + 4.0) * 0.3 + noise3(q * 5.1) * 0.1;
  float layer = exp(-max(p.y, 0.0) * (0.35 - uStorm * 0.2));
  return smoothstep(0.35, 0.8, n) * layer;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 rd = normalize(uFwd * 1.5 + uRight * uv.x + uUp * uv.y);
  vec3 ro = uEye;

  float t = 0.0, id = 0.0;
  bool hit = false;
  for (int i = 0; i < 110; i++) {
    vec3 p = ro + rd * t;
    float d = map(p, id);
    if (d < 0.002 * t) { hit = true; break; }
    t += d;
    if (t > 90.0) break;
  }

  vec3 col;
  if (hit) {
    vec3 p = ro + rd * t;
    vec3 n = normalAt(p);
    vec3 albedo;
    if (id > 0.5) {
      // Limestone courses: horizontal block rows with jittered joints and weathering.
      float row = floor(p.y * 7.0);
      float joint = smoothstep(0.0, 0.08, fract(p.y * 7.0)) * smoothstep(0.0, 0.05, fract((p.x + p.z) * 3.0 + hash12(vec2(row, 3.0))));
      float w = noise2(p.xz * 3.0 + p.y * 9.0);
      albedo = mix(vec3(0.62, 0.48, 0.32), vec3(0.85, 0.7, 0.5), w) * (0.65 + 0.35 * joint);
    } else {
      // Wind ripples bend the normal and darken the troughs.
      float rip = sin(dot(p.xz, vec2(5.0, 1.7)) + noise2(p.xz * 1.3) * 4.0);
      n = normalize(n + vec3(0.12 * rip, 0.0, 0.04 * rip));
      albedo = mix(vec3(0.78, 0.55, 0.32), vec3(0.93, 0.74, 0.5), 0.5 + 0.5 * rip);
    }
    float dif = max(dot(n, uSunDir), 0.0);
    float sh = softShadow(p + n * 0.02, uSunDir);
    float amb = 0.5 + 0.5 * n.y;
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    col = albedo * (uSunCol * dif * sh * 2.2 + uSkyTop * amb * 0.55 + uSkyHorizon * rim * 0.4);
    // Atmospheric haze.
    col = mix(col, sky(rd) * 0.9, 1.0 - exp(-t * 0.012));
  } else {
    col = sky(rd);
    t = 90.0;
  }

  // Volumetric dust: a few jittered samples along the view ray.
  vec3 dustCol = mix(vec3(0.75, 0.52, 0.3), uSunCol * vec3(1.0, 0.7, 0.45), 0.35);
  float trans = 1.0;
  vec3 scatter = vec3(0.0);
  float len = min(t, 60.0);
  float jitter = hash12(gl_FragCoord.xy + fract(uTime) * 61.0);
  float storm = clamp(uStorm + uGust, 0.0, 1.4);
  for (int i = 0; i < 8; i++) {
    float st = len * (float(i) + jitter) / 8.0;
    vec3 p = ro + rd * st;
    float dens = dust(p) * storm * 0.09 * (len / 8.0);
    float phase = 1.0 + pow(max(dot(rd, uSunDir), 0.0), 6.0) * 1.6;
    scatter += trans * dens * dustCol * phase;
    trans *= exp(-dens);
  }
  col = col * trans + scatter;
  // Uniform brown-out grows with the storm.
  col = mix(col, dustCol * 0.85, storm * 0.35 * (1.0 - exp(-t * 0.05)));

  // Flying sand streaks, stretched along the wind direction on screen.
  vec2 sp = gl_FragCoord.xy / uRes.y;
  float streak = noise2(vec2(sp.x * 6.0 - uTime * (6.0 + storm * 10.0), sp.y * 260.0));
  streak *= noise2(vec2(sp.x * 1.5 - uTime * 2.0, sp.y * 9.0));
  col += vec3(1.0, 0.82, 0.6) * smoothstep(0.45, 0.85, streak) * storm * 0.22;

  // Filmic tone and grade.
  col = 1.0 - exp(-col * 1.25);
  col = pow(col, vec3(0.95, 1.0, 1.08));
  vec2 q = vUv - 0.5;
  col *= 1.0 - dot(q, q) * 0.8;
  o = vec4(col, 1.0);
}`;

const prog = D.program(gl, D.FS_VS, FS);
const cam = D.orbit(s.canvas, {
  dist: 26, yaw: 0.65, pitch: 0.12, target: [-2, 3, -3],
  minDist: 12, maxDist: 45, minPitch: 0.02, maxPitch: 0.7, autoRotate: 0.05,
});

const TIMES = [
  { name: '황혼', sun: [0.75, 0.18, -0.45], col: [1.6, 0.85, 0.45], top: [0.25, 0.32, 0.5], hor: [0.95, 0.62, 0.38] },
  { name: '한낮', sun: [0.35, 0.8, -0.3], col: [1.5, 1.3, 1.05], top: [0.25, 0.48, 0.85], hor: [0.85, 0.82, 0.75] },
  { name: '달밤', sun: [-0.4, 0.45, 0.6], col: [0.35, 0.45, 0.7], top: [0.01, 0.02, 0.06], hor: [0.08, 0.1, 0.18] },
];
let timeOfDay = 0;
let storm = 0.35, stormTarget = 0.35, gust = 0;

D.cycle(TIMES.map((x) => x.name), (i) => (timeOfDay = i), 'time');
D.cycle(['폭풍 보통', '폭풍 강하게', '맑음'], (i) => (stormTarget = [0.35, 0.75, 0][i]), 'storm');
cam.onTap = () => (gust = 0.8);
D.hint('드래그: 시점 회전 · 핀치: 확대 · 탭: 돌풍');

D.loop(s, (time, dt) => {
  cam.update(dt);
  storm += (stormTarget - storm) * Math.min(1, dt * 1.5);
  gust *= Math.exp(-dt * 1.2);
  const b = cam.basis();
  const td = TIMES[timeOfDay];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, s.width, s.height);
  prog.use().set({
    uRes: [s.width, s.height], uTime: time,
    uEye: b.eye, uRight: b.right, uUp: b.up, uFwd: b.forward,
    uStorm: storm, uGust: gust,
    uSunDir: D.vec3.norm(td.sun), uSunCol: td.col, uSkyTop: td.top, uSkyHorizon: td.hor,
  });
  D.drawFullscreen(gl);
});
</script>
</body>
</html>
